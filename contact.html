<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | The Caffeine Culture</title>

  <!-- AOS Animation CSS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wdth,wght@0,18..144,87..112,300..900;1,18..144,87..112,300..900&family=Roboto+Slab:wght@100..900&display=swap"
    rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="assets/css/main.css">

</head>

<body>
  <div id="header"></div>
  <main class="container">
    <section class="contact-page">
      <h1 class="section-title">Contact Us</h1>
      <p class="section-lead">Questions, reservations, bulk orders, or events? Our team would love to hear from you.</p>
      <div class="contact-layout">
        <article class="contact-info">
          <h2>Visit The Cafe</h2>
          <p><strong>Address:</strong> 125 Brew Street, Colombo</p>
          <p><strong>Phone:</strong> +94 77 123 4567</p>
          <p><strong>Email:</strong> hello@thecaffeineculture.com</p>
          <p><strong>Hours:</strong> Mon-Sun, 7:00 AM - 10:00 PM</p>
        </article>
        <form class="contact-form">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your email" required />
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can we help?"></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>
  </main>
  <div id="footer"></div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Your Main JS -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
